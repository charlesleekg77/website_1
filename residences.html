<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a1a">
<title>Residences — Estate Catalogue | Springs Estate</title>
<meta name="description" content="Browse the Springs Estate catalogue of ultra-luxury residences, villas, penthouses and private estates. Filter by status, price, bedrooms, floor area and view.">
<link rel="canonical" href="residences.html">
<meta property="og:title" content="Residences — Springs Estate Catalogue">
<meta property="og:description" content="Ten architecturally significant residences across the California coast.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%231a1a1a'/%3E%3Cpath d='M20 7v26M7 20h26' stroke='%23d4af37' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='20' r='5.5' stroke='%23d4af37' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="residences">
<a class="skip" href="#main" style="position:absolute;left:-9999px">Skip to content</a>
<div id="site-header"></div>

<main id="main">

  <!-- ============================ PAGE HERO ============================ -->
  <section class="pagehero pagehero--short" aria-labelledby="catalogue-heading">
    <div class="pagehero__img">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=82"
           alt="Architectural residence with pool at twilight" fetchpriority="high" decoding="async">
    </div>
    <div class="pagehero__inner">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span>/</span><span style="opacity:1">Residences</span>
      </nav>
      <span class="eyebrow eyebrow--light">The Catalogue</span>
      <h1 class="h1" id="catalogue-heading" style="margin-top:1.25rem">Residences &amp; Estates</h1>
      <p class="lede">
        Ten architecturally significant properties, from cliffside villas to
        single-floor penthouses. Filter the collection to your brief.
      </p>
    </div>
  </section>

  <!-- ============================ FILTER BAR ============================ -->
  <div class="filterbar" id="filterbar">
    <div class="shell">
      <form class="filterbar__inner" id="filters" novalidate aria-label="Filter residences">
        <div class="filterbar__fields">
          <label class="field">
            <span>Status</span>
            <select class="select" id="f-status" name="status">
              <option value="all">All statuses</option>
              <option value="available">Available</option>
              <option value="under-contract">Under Contract</option>
              <option value="sold">Sold</option>
            </select>
          </label>
          <label class="field">
            <span>Price</span>
            <select class="select" id="f-price" name="price">
              <option value="all">Any price</option>
              <option value="0-12">Under $12M</option>
              <option value="12-20">$12M – $20M</option>
              <option value="20-30">$20M – $30M</option>
              <option value="30+">$30M and above</option>
            </select>
          </label>
          <label class="field">
            <span>Bedrooms</span>
            <select class="select" id="f-beds" name="beds">
              <option value="all">Any</option>
              <option value="3">3+</option>
              <option value="4">4+</option>
              <option value="5">5+</option>
              <option value="6">6+</option>
            </select>
          </label>
          <label class="field">
            <span>Floor area</span>
            <select class="select" id="f-sqft" name="sqft">
              <option value="all">Any size</option>
              <option value="5000">5,000+ sq ft</option>
              <option value="8000">8,000+ sq ft</option>
              <option value="10000">10,000+ sq ft</option>
            </select>
          </label>
          <label class="field">
            <span>View</span>
            <select class="select" id="f-view" name="view">
              <option value="all">All views</option>
              <option value="ocean">Ocean</option>
              <option value="mountain">Mountain</option>
              <option value="golf">Golf</option>
              <option value="garden">Garden</option>
              <option value="city">City</option>
            </select>
          </label>
          <label class="field">
            <span>Type</span>
            <select class="select" id="f-type" name="type">
              <option value="all">All types</option>
              <option value="villa">Villa</option>
              <option value="estate">Estate</option>
              <option value="penthouse">Penthouse</option>
              <option value="residence">Residence</option>
            </select>
          </label>
          <label class="field">
            <span>Sort by</span>
            <select class="select" id="f-sort" name="sort">
              <option value="featured">Featured first</option>
              <option value="price-desc">Price · high to low</option>
              <option value="price-asc">Price · low to high</option>
              <option value="sqft-desc">Largest first</option>
              <option value="beds-desc">Most bedrooms</option>
              <option value="newest">Newest first</option>
            </select>
          </label>
        </div>

        <div class="viewtoggle" role="group" aria-label="View layout">
          <button type="button" data-layout="grid" aria-pressed="true" aria-label="Grid view" title="Grid view">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1.5" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="9" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="9" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button type="button" data-layout="list" aria-pressed="false" aria-label="List view" title="List view">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </form>

      <div class="chips" id="active-chips" style="display:none"></div>
    </div>
  </div>

  <!-- ============================ RESULTS ============================ -->
  <section class="shell" aria-label="Residence results">
    <div class="results-meta" id="results-meta"></div>
    <div class="results results--grid" id="results"></div>
  </section>

  <!-- ============================ HELP CTA ============================ -->
  <section class="section section--dark on-dark section--tight" aria-labelledby="help-heading">
    <div class="shell" style="display:flex;flex-wrap:wrap;gap:2rem;align-items:center;justify-content:space-between">
      <div data-reveal>
        <span class="eyebrow eyebrow--light">Not seeing it?</span>
        <h2 class="h3" id="help-heading" style="margin-top:1rem">Off-market residences are never listed</h2>
      </div>
      <div data-reveal data-reveal-delay="1" style="display:flex;gap:1rem;flex-wrap:wrap">
        <a class="btn btn--gold" href="contact.html">Register Your Brief</a>
        <a class="btn btn--ghost-light" href="lifestyle.html">Explore the Lifestyle</a>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = { corePlugins: { preflight: false } };
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="main.js"></script>
</body>
</html>
